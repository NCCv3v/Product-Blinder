name: Native desktop and evaluation engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt offscreen libraries
        run: |
          set -euo pipefail
          # GitHub runners sometimes cannot resolve azure.archive.ubuntu.com.
          # Point apt at the public Ubuntu archives and fail over quickly.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          fi
          shopt -s nullglob
          for src in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$src"
          done

          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::http::Pipeline-Depth=0
          )
          pkgs=(
            libegl1
            libgl1
            libxkbcommon0
            libxkbcommon-x11-0
            libdbus-1-3
            libfontconfig1
            libfreetype6
            libxcb1
            libxcb-cursor0
            libxcb-icccm4
            libxcb-image0
            libxcb-keysyms1
            libxcb-randr0
            libxcb-render-util0
            libxcb-shape0
            libxcb-shm0
            libxcb-xfixes0
            libxcb-xinerama0
            libxcb-xkb1
            libx11-xcb1
            libxi6
            libxrender1
          )

          for attempt in 1 2 3 4 5; do
            if sudo apt-get update "${APT_OPTS[@]}" \
              && sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" "${pkgs[@]}"; then
              exit 0
            fi
            echo "apt failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 8))
          done
          echo "apt could not install Qt offscreen libraries after 5 attempts"
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[desktop,dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: product-blinder --db data/ci-five.sqlite demo-five --out reports/ci-five
      - run: product-blinder-desktop --db data/ci-five.sqlite --smoke --smoke-out reports/ci-five/native-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: five-repetition-demo-${{ matrix.python }}
          path: reports/ci-five
  docker-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose run --rm product-blinder --db /app/data/ci.sqlite demo-five --out /app/data/demo
