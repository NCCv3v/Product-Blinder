[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-blinder"
version = "0.7.0"
description = "Local-first paired regression testing for LLM products"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
build = ["pyinstaller>=6.12,<7"]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.9,<1"]

[project.scripts]
product-blinder = "product_blinder.cli:main"
product-blinder-desktop = "product_blinder.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
product_blinder = ["data/*.yaml", "assets/icons/*.svg", "assets/icons/*.png", "assets/branding/*.png"]
